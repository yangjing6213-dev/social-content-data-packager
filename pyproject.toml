[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "social-content-data-packager"
version = "1.0.0"
description = "CLI engine for the Popular Platform Data Collection Skill and auditable Chinese data archives."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hqwzhu" }]
keywords = ["datatool", "social-content", "transcription", "data-packaging"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["openpyxl>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/yangjing6213-dev/social-content-data-packager"
Documentation = "https://github.com/yangjing6213-dev/social-content-data-packager#readme"
Issues = "https://github.com/yangjing6213-dev/social-content-data-packager/issues"
Security = "https://github.com/yangjing6213-dev/social-content-data-packager/security/policy"

[project.optional-dependencies]
transcribe = ["openai-whisper>=20250625"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
social-content-packager = "social_content_data_packager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["social_content_data_packager"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
